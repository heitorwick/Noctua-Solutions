<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noctua Solutions — Assistência Técnica</title>
  <meta name="description" content="Assistência técnica e manutenção de computadores. Soluções rápidas, eficientes e de qualidade para residências, empresas e autônomos." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" type="image/png" href="assets/noctua-logo.png" />
  <style>
/* ============================================================
   NOCTUA SOLUTIONS — nocturnal tech design system
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  /* surfaces — nocturnal graphite/blue */
  --bg-0: #080B12;
  --bg-1: #0D1117;
  --bg-2: #131926;
  --bg-3: #19202F;
  --bg-card: #141B28;
  --border: rgba(150, 168, 200, 0.12);
  --border-strong: rgba(150, 168, 200, 0.22);

  /* text */
  --text: #EAEFF7;
  --text-2: #B7C2D4;
  --text-muted: #7E8AA0;

  /* brand accent (violet from the owl logo) — overridable by Tweaks */
  --accent: #8B5CF6;
  --accent-2: #22D3EE;
  --accent-deep: #6D3FD1;
  --accent-soft: rgba(139, 92, 246, 0.14);
  --accent-glow: rgba(139, 92, 246, 0.40);

  --wa: #25D366;

  /* shape */
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 30px;

  --maxw: 1200px;
  --shadow-card: 0 18px 48px -22px rgba(0,0,0,0.8);
  --shadow-glow: 0 0 0 1px var(--border), 0 24px 60px -28px var(--accent-glow);

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 92px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  background: var(--bg-1);
  color: var(--text);
  font-family: 'Manrope', system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* nocturnal backdrop: subtle star noise + aurora glows */
.night-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(900px 520px at 78% -8%, var(--accent-soft), transparent 60%),
    radial-gradient(760px 480px at 8% 12%, rgba(34, 211, 238, 0.08), transparent 62%),
    radial-gradient(1100px 700px at 50% 118%, rgba(109, 63, 209, 0.12), transparent 60%);
}
.night-bg::after {
  content: ""; position: absolute; inset: 0;
  background-image:
    radial-gradient(1.4px 1.4px at 20% 30%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.2px 1.2px at 70% 22%, rgba(255,255,255,.35), transparent),
    radial-gradient(1.6px 1.6px at 42% 64%, rgba(255,255,255,.30), transparent),
    radial-gradient(1.1px 1.1px at 86% 70%, rgba(255,255,255,.32), transparent),
    radial-gradient(1.3px 1.3px at 12% 80%, rgba(255,255,255,.28), transparent),
    radial-gradient(1.2px 1.2px at 60% 88%, rgba(255,255,255,.22), transparent);
  opacity: .5;
}
/* tech-grid vibe (toggled via Tweaks) */
body[data-vibe="grid"] .night-bg {
  background:
    radial-gradient(800px 460px at 80% -10%, var(--accent-soft), transparent 60%),
    linear-gradient(var(--bg-1), var(--bg-1));
}
body[data-vibe="grid"] .night-bg::after {
  background-image:
    linear-gradient(rgba(150,168,200,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(150,168,200,.06) 1px, transparent 1px);
  background-size: 56px 56px;
  opacity: 1;
  mask-image: radial-gradient(120% 90% at 50% 0%, #000 35%, transparent 78%);
}

.shell { position: relative; z-index: 1; }
.wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }

/* ---------- typography ---------- */
h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; margin: 0; }
.eyebrow {
  font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 500;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent);
  display: inline-flex; align-items: center; gap: 9px;
}
.eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--accent); opacity: .7; }
.section-h { font-size: clamp(30px, 4vw, 46px); }
.lede { color: var(--text-2); font-size: 18px; max-width: 56ch; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15.5px;
  padding: 14px 22px; border-radius: 999px; border: 1px solid transparent;
  cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .2s, border-color .2s;
}
.btn svg { width: 19px; height: 19px; }
.btn-primary {
  color: #fff;
  background: linear-gradient(120deg, var(--accent-deep), var(--accent) 55%, var(--accent-2));
  box-shadow: 0 14px 34px -14px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.18);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 20px 44px -14px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.22); }
.btn-ghost {
  color: var(--text); background: rgba(255,255,255,.03); border-color: var(--border-strong);
  backdrop-filter: blur(6px);
}
.btn-ghost:hover { transform: translateY(-2px); border-color: var(--accent); color: #fff; background: var(--accent-soft); }
.btn-lg { padding: 17px 30px; font-size: 17px; }
.online-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wa); box-shadow: 0 0 0 0 rgba(37,211,102,.6); animation: pulse 2.2s infinite; }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(37,211,102,.5);} 70%{box-shadow:0 0 0 7px rgba(37,211,102,0);} 100%{box-shadow:0 0 0 0 rgba(37,211,102,0);} }

/* ---------- header ---------- */
.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  transition: background .3s, border-color .3s, backdrop-filter .3s;
  border-bottom: 1px solid transparent;
}
.header.scrolled { background: rgba(10, 13, 20, 0.72); backdrop-filter: blur(16px) saturate(1.3); border-bottom-color: var(--border); }
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 78px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
.brand-img { height: 62px; width: auto; display: block; }
.brand-logo { width: 38px; height: 38px; display: grid; place-items: center; }
.brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 21px; letter-spacing: .14em; }
.nav { display: flex; align-items: center; gap: 6px; }
.nav a {
  color: var(--text-2); text-decoration: none; font-weight: 600; font-size: 15px;
  padding: 9px 15px; border-radius: 999px; position: relative; transition: color .2s, background .2s;
}
.nav a:hover { color: var(--text); }
.nav a.active { color: #fff; }
.nav a.active::after { content:""; position:absolute; left:15px; right:15px; bottom:3px; height:2px; border-radius:2px; background: linear-gradient(90deg,var(--accent),var(--accent-2)); }
.header-cta { display: flex; align-items: center; gap: 14px; }
.menu-btn { display: none; background: transparent; border: 1px solid var(--border-strong); color: var(--text); width: 44px; height: 44px; border-radius: 12px; cursor: pointer; }

/* mobile drawer */
.drawer { position: fixed; inset: 0; z-index: 60; display: none; }
.drawer.open { display: block; }
.drawer-scrim { position:absolute; inset:0; background: rgba(5,7,12,.66); backdrop-filter: blur(4px); }
.drawer-panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(82vw, 340px);
  background: var(--bg-2); border-left: 1px solid var(--border); padding: 24px;
  display: flex; flex-direction: column; gap: 8px; transform: translateX(0);
  animation: slideIn .3s var(--ease);
}
@keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
.drawer-panel a { color: var(--text); text-decoration: none; font-family: 'Space Grotesk'; font-size: 22px; font-weight: 500; padding: 14px 8px; border-bottom: 1px solid var(--border); }
.drawer-panel a:hover { color: var(--accent); }

/* ---------- hero ---------- */
.hero { padding: 168px 0 96px; position: relative; }
.hero-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 56px; align-items: center; }
.hero h1 { font-size: clamp(40px, 6.4vw, 76px); font-weight: 700; }
.hero h1 .grad { background: linear-gradient(110deg, var(--accent) 10%, var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .lede { margin: 22px 0 34px; font-size: 19.5px; }
.hero-cta { display: flex; gap: 14px; flex-wrap: wrap; }
.hero-trust {
  display: flex; gap: 0; margin-top: 44px; flex-wrap: wrap; align-items: stretch;
}
.trust-item {
  display: flex; flex-direction: column; gap: 4px;
  padding: 0 28px; position: relative;
}
.trust-item:first-child { padding-left: 0; }
.trust-item:not(:first-child)::before {
  content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 1px;
  background: linear-gradient(180deg, var(--accent), var(--accent-2) 60%, transparent);
  opacity: .5;
}
.trust-item b {
  font-family: 'Space Grotesk'; font-size: 34px; font-weight: 700; line-height: 1;
  background: linear-gradient(110deg, var(--accent) 20%, var(--accent-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.trust-item span { font-size: 13.5px; color: var(--text-2); line-height: 1.35; }

/* hero visual */
.hero-visual { position: relative; display: grid; place-items: center; min-height: 420px; }
.halo { position: absolute; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(circle, var(--accent-glow), transparent 62%); filter: blur(8px); }
.owl-ring { position: absolute; border-radius: 50%; border: 1px solid var(--border-strong); }
.owl-ring.r1 { width: 320px; height: 320px; animation: spin 38s linear infinite; }
.owl-ring.r2 { width: 420px; height: 420px; border-style: dashed; opacity: .5; animation: spin 64s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.owl-orb {
  position: relative; width: 260px; height: 260px; border-radius: 50%;
  background: radial-gradient(circle at 50% 34%, var(--bg-3), var(--bg-0) 72%);
  border: 1px solid var(--border-strong);
  display: grid; place-items: center;
  box-shadow: inset 0 2px 30px rgba(0,0,0,.6), 0 30px 80px -30px var(--accent-glow);
}
.owl-orb svg { width: 150px; height: 150px; }
.orb-logo { width: 128px; height: auto; display: block; filter: drop-shadow(0 8px 22px rgba(0,0,0,.5)); }

/* pulse rings emanating from orb */
.pulse-ring {
  position: absolute; width: 260px; height: 260px; border-radius: 50%;
  border: 1px solid var(--accent); opacity: 0; pointer-events: none;
  animation: pulseRing 3.6s ease-out infinite;
}
.pulse-ring.pr2 { animation-delay: 1.2s; }
.pulse-ring.pr3 { animation-delay: 2.4s; }
@keyframes pulseRing {
  0%   { transform: scale(1);   opacity: 0.5; }
  100% { transform: scale(2.0); opacity: 0;   }
}

/* chip wrappers — position via inline style, float via CSS */
.chip-wrap { position: absolute; }
.chip-wrap.c1 { animation: float 5.5s ease-in-out infinite; }
.chip-wrap.c2 { animation: float 6.5s ease-in-out infinite .8s; }
.chip-wrap.c3 { animation: float 6s   ease-in-out infinite .4s; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

/* chip — visual card + fade transition */
.chip {
  display: flex; align-items: center; gap: 11px;
  background: rgba(10, 14, 24, 0.92);
  border: 1px solid rgba(150, 168, 200, 0.18);
  backdrop-filter: blur(20px) saturate(1.6);
  padding: 10px 16px 10px 10px; border-radius: 16px;
  font-size: 13px; font-weight: 600; white-space: nowrap;
  box-shadow: 0 10px 36px -8px rgba(0,0,0,.75), 0 0 0 1px rgba(139,92,246,.1);
  overflow: hidden;
  opacity: 1; filter: blur(0); transform: translateY(0) scale(1);
  transition: opacity .58s var(--ease), filter .58s var(--ease), transform .58s var(--ease),
              border-color .3s var(--ease), box-shadow .3s var(--ease);
}
.chip.chip-hidden { opacity: 0; filter: blur(7px); transform: translateY(12px) scale(0.9); }
.chip:hover {
  border-color: rgba(139,92,246,.5);
  box-shadow: 0 10px 36px -8px rgba(0,0,0,.75), 0 0 22px -4px var(--accent-glow);
}
/* shimmer sweep */
.chip::after {
  content: ''; position: absolute; top: 0; left: -120%; width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent);
  animation: chipShimmer 5s ease-in-out infinite;
  pointer-events: none;
}
.chip-wrap.c2 .chip::after { animation-delay: 1.8s; }
.chip-wrap.c3 .chip::after { animation-delay: 0.9s; }
@keyframes chipShimmer { 0% { left: -120%; } 35%, 100% { left: 130%; } }

.chip-icon {
  width: 32px; height: 32px; border-radius: 9px; flex: none;
  background: linear-gradient(135deg, var(--accent-soft), rgba(34,211,238,.08));
  border: 1px solid rgba(139,92,246,.22);
  display: grid; place-items: center;
}
.chip-icon svg { width: 15px; height: 15px; color: var(--accent-2); }

/* ---------- sections ---------- */
section { position: relative; }
.block { padding: 92px 0; }
.section-head { max-width: 640px; margin-bottom: 52px; }
.section-head .section-h { margin-top: 14px; }
.section-head p { color: var(--text-2); margin: 16px 0 0; font-size: 18px; }

/* services */
.services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.svc-card {
  position: relative; background: linear-gradient(180deg, var(--bg-card), var(--bg-2));
  border: 1px solid var(--border); border-radius: var(--r-lg); padding: 30px 28px 32px;
  overflow: hidden; transition: transform .35s var(--ease), border-color .3s, box-shadow .35s var(--ease);
}
.svc-card::before { content:""; position:absolute; inset:0 0 auto 0; height:3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); opacity:0; transition: opacity .3s; }
.svc-card:hover { transform: translateY(-7px); border-color: var(--border-strong); box-shadow: var(--shadow-glow); }
.svc-card:hover::before { opacity: 1; }
.svc-icon {
  width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center;
  background: var(--accent-soft); border: 1px solid var(--border-strong); color: var(--accent);
  margin-bottom: 22px;
}
.svc-icon svg { width: 30px; height: 30px; }
.svc-card h3 { font-size: 24px; margin-bottom: 6px; }
.svc-card .svc-tag { font-family: 'JetBrains Mono'; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }
.svc-list { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
.svc-list li { display: flex; gap: 11px; align-items: flex-start; color: var(--text-2); font-size: 15px; line-height: 1.5; }
.svc-list li svg { flex: none; width: 18px; height: 18px; margin-top: 2px; color: var(--accent-2); }

/* about */
.about-grid { display: grid; grid-template-columns: 1fr 0.86fr; gap: 56px; align-items: center; }
.about-tag { font-family: 'Space Grotesk'; font-size: clamp(26px,3.4vw,38px); font-weight: 600; letter-spacing: -.02em; margin: 26px 0 0; }
.about-tag .grad { background: linear-gradient(110deg,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.about-points { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 30px; }
.about-point { display: flex; gap: 12px; align-items: flex-start; }
.about-point svg { flex:none; width: 22px; height: 22px; color: var(--accent); margin-top: 2px; }
.about-point b { display:block; font-size: 15.5px; color: var(--text); }
.about-point span { font-size: 13.5px; color: var(--text-muted); }
.about-visual {
  position: relative; border-radius: var(--r-xl); overflow: hidden; min-height: 420px;
  border: 1px solid var(--border); background: linear-gradient(160deg, var(--bg-2), var(--bg-0));
  display: grid; place-items: center;
}
.about-visual .ph { display: grid; place-items: center; gap: 14px; color: var(--text-muted); text-align: center; padding: 24px; }
.about-visual .ph svg { width: 64px; height: 64px; color: var(--accent); opacity:.85; }
.about-visual .ph span { font-family:'JetBrains Mono'; font-size: 12px; letter-spacing:.12em; text-transform: uppercase; }
.about-orbit { position:absolute; inset:0; background:
  radial-gradient(420px 320px at 70% 20%, var(--accent-soft), transparent 60%),
  radial-gradient(360px 300px at 18% 90%, rgba(34,211,238,.10), transparent 62%); }

/* contact / footer */
.contact { padding: 96px 0 0; }
.contact-card {
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--bg-2), var(--bg-0));
  border: 1px solid var(--border-strong); border-radius: var(--r-xl);
  padding: 60px clamp(28px, 5vw, 72px); text-align: center;
  box-shadow: var(--shadow-card);
}
.contact-card::before { content:""; position:absolute; inset:0; background: radial-gradient(620px 360px at 50% -20%, var(--accent-glow), transparent 60%); opacity:.6; pointer-events:none; }
.contact-card h2 { font-size: clamp(32px, 4.6vw, 54px); position: relative; }
.contact-card p { color: var(--text-2); font-size: 19px; margin: 18px auto 32px; max-width: 52ch; position: relative; }
.contact-cta { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; position: relative; }

.footer { padding: 64px 0 40px; margin-top: 80px; border-top: 1px solid var(--border); }
.footer-top { display: flex; justify-content: space-between; gap: 40px; flex-wrap: wrap; }
.footer-brand { max-width: 320px; }
.footer-brand p { color: var(--text-muted); font-size: 14.5px; margin: 16px 0 0; }
.socials { display: flex; gap: 12px; margin-top: 22px; }
.social {
  width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
  background: rgba(255,255,255,.03); border: 1px solid var(--border); color: var(--text-2);
  transition: transform .25s var(--ease), color .2s, border-color .2s, background .2s;
}
.social:hover { transform: translateY(-3px); color: #fff; border-color: var(--accent); background: var(--accent-soft); }
.social svg { width: 20px; height: 20px; }
.footer-cols { display: flex; gap: 64px; flex-wrap: wrap; }
.footer-col h4 { font-family:'JetBrains Mono'; font-size: 12px; letter-spacing:.16em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 16px; font-weight: 500; }
.footer-col a, .footer-col span { display:block; color: var(--text-2); text-decoration: none; font-size: 15px; padding: 5px 0; transition: color .2s; }
.footer-col a:hover { color: var(--accent); }
.footer-bottom { display:flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 48px; padding-top: 26px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 13.5px; }
.team-credits { display:flex; gap: 16px; flex-wrap: wrap; }
.team-credits a { color: var(--text-2); text-decoration: none; font-family:'JetBrains Mono'; font-size: 13px; }
.team-credits a:hover { color: var(--accent); }

/* floating whatsapp */
.fab-wrap {
  position: fixed; right: 22px; bottom: 22px; z-index: 45;
  display: flex; align-items: center; gap: 12px;
}
.fab {
  width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center;
  background: var(--wa); color: #fff; box-shadow: 0 14px 34px -10px rgba(37,211,102,.6);
  transition: transform .25s var(--ease); border: none; cursor: pointer;
  text-decoration: none; flex: none;
}
.fab:hover { transform: scale(1.08); }
.fab svg { width: 30px; height: 30px; }
.fab-tip {
  background: rgba(10, 14, 24, 0.94);
  border: 1px solid var(--border-strong);
  color: var(--text);
  font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600;
  padding: 9px 16px; border-radius: 12px; white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,.45);
  backdrop-filter: blur(14px);
  opacity: 0; pointer-events: none;
  transform: translateX(10px);
  transition: opacity .26s var(--ease), transform .26s var(--ease);
}
.fab-wrap:hover .fab-tip { opacity: 1; transform: translateX(0); }

/* scroll progress bar */
.scroll-bar {
  position: fixed; top: 0; left: 0; height: 2.5px; z-index: 200;
  background: linear-gradient(90deg, var(--accent-deep), var(--accent) 50%, var(--accent-2));
  transition: width .08s linear;
  pointer-events: none;
  box-shadow: 0 0 10px var(--accent-glow), 0 0 4px var(--accent);
  transform-origin: left;
}

/* reveal animation — FAIL-SAFE: base state is visible; entrance only animates
   *toward* that base. If JS never adds .in, or the tab is hidden (animations
   throttled), content still shows. */
.reveal { opacity: 1; transform: none; }
@media (prefers-reduced-motion: no-preference) {
  .reveal.in { animation: revealIn .66s var(--ease); }
}
@keyframes revealIn { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

/* ---------- responsive ---------- */
@media (max-width: 920px) {
  .nav, .header-cta .btn { display: none; }
  .menu-btn { display: grid; place-items: center; }
  .hero-grid { grid-template-columns: 1fr; gap: 36px; }
  .hero-visual { min-height: 340px; order: -1; }

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

function useReveal() {
  useEffect(() => {

        if (el.getBoundingClientRect().top < h * 0.9) el.classList.add('in');
      });
    };
    const onScroll = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(check); };
    check();
    requestAnimationFrame(check);
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); cancelAnimationFrame(raf); };
  }, []);
}

function ScrollProgress() {
  const [pct, setPct] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
      const max = scrollHeight - clientHeight;
      setPct(max <= 0 ? 0 : (scrollTop / max) * 100);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return <div className="scroll-bar" style={{ width: `${pct}%` }} />;
}

  Violeta: { a: '#8B5CF6', a2: '#22D3EE', deep: '#6D3FD1' },

  Azul:    { a: '#3B82F6', a2: '#22D3EE', deep: '#2563EB' },
  Indigo:  { a: '#7C7BFF', a2: '#C084FC', deep: '#5B5BE0' },
};

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255}, ${n >> 8 & 255}, ${n & 255}, ${a})`;
}

      </div>
      <TweaksPanel>
        <TweakSection label="Cor de destaque" />
        <TweakRadio label="Accent" value={t.accent} options={Object.keys(ACCENTS)} onChange={(v) => setTweak('accent', v)} />
        <TweakSection label="Atmosfera noturna" />
        <TweakRadio label="Fundo" value={t.vibe} options={['glow', 'grid']} onChange={(v) => setTweak('vibe', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
