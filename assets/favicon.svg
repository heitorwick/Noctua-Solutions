<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#0D1117"/>

  <!-- ear tufts -->
  <path d="M21 40 L26 8 L44 27 Z" fill="#7040D0"/>
  <path d="M79 40 L74 8 L56 27 Z" fill="#7040D0"/>

  <!-- head circle -->
  <circle cx="50" cy="56" r="36" fill="#7040D0"/>

  <!-- left eye: outer cutout, inner ring, inner cutout, pupil -->
  <circle cx="34" cy="46" r="12.5" fill="#0D1117"/>
  <circle cx="34" cy="46" r="8"    fill="#7040D0"/>
  <circle cx="34" cy="46" r="4.5"  fill="#0D1117"/>
  <circle cx="34" cy="46" r="2.2"  fill="#7040D0"/>

  <!-- right eye -->
  <circle cx="66" cy="46" r="12.5" fill="#0D1117"/>
  <circle cx="66" cy="46" r="8"    fill="#7040D0"/>
  <circle cx="66" cy="46" r="4.5"  fill="#0D1117"/>
  <circle cx="66" cy="46" r="2.2"  fill="#7040D0"/>

  <!-- nose bridge -->
  <line x1="50" y1="36" x2="50" y2="57" stroke="#0D1117" stroke-width="2.8" stroke-linecap="round"/>

  <!-- circuit element: oval component -->
  <ellipse cx="50" cy="61" rx="3" ry="4.5" fill="#0D1117"/>

  <!-- circuit branches -->
  <line x1="50" y1="65" x2="44" y2="75" stroke="#0D1117" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="50" y1="65" x2="50" y2="76" stroke="#0D1117" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="50" y1="65" x2="56" y2="75" stroke="#0D1117" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="44" cy="76" r="2.2" fill="#0D1117"/>
  <circle cx="50" cy="77" r="2.2" fill="#0D1117"/>
  <circle cx="56" cy="76" r="2.2" fill="#0D1117"/>

  <!-- feather arcs -->
  <path d="M18 70 Q50 83 82 70" stroke="#0D1117" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M23 78 Q50 89 77 78" stroke="#0D1117" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
